<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- EsLat, stacked: "Es" above "Lat" in the same palette — blue gradient over cyan accent.
       textLength pins each line to an exact width and text-anchor keeps both centred, so the
       stack neither clips nor drifts when the host resolves a different sans-serif (an <img>
       cannot load webfonts). -->
  <text x="18" y="17" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="-0.3" textLength="17" lengthAdjust="spacingAndGlyphs" fill="url(#eslat-es)">Es</text>
  <text x="18" y="29" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.1" textLength="16.5" lengthAdjust="spacingAndGlyphs" fill="#45D9E7">Lat</text>
  <defs>
    <linearGradient id="eslat-es" x1="9.5" y1="7" x2="26.5" y2="18" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7AC2FF"/>
      <stop offset="1" stop-color="#4A65E8"/>
    </linearGradient>
  </defs>
</svg>
