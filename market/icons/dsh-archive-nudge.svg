<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="dsh-archive-nudge">
  <title>dsh-archive-nudge</title>
  <!-- Rounded plate: stays legible on both light and dark backgrounds. -->
  <rect width="64" height="64" rx="14" fill="#2b6cf6"/>
  <!-- Archive box: lid + body + a down arrow (the arrow keeps it from reading
       as a trash can). Every edge sits on a 4-unit grid so the shape stays
       crisp at 16 / 32 / 64 px. -->
  <rect x="8" y="16" width="48" height="12" rx="3" fill="#ffffff"/>
  <rect x="12" y="32" width="40" height="20" rx="3" fill="#ffffff"/>
  <g fill="none" stroke="#2b6cf6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 37v11"/>
    <path d="M26 43l6 6 6-6"/>
  </g>
</svg>
