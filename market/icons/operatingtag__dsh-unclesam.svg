<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="DeepSeek Web Chat">
  <!--
    A browser window whose content is a speech bubble: the provider is a webpage that answers.
    Drawn with a single warm accent so it reads at 16px in a dense plugin list, and with enough
    internal contrast that it survives both light and dark rows.
  -->
  <rect x="3" y="10" width="58" height="44" rx="6" ry="6" fill="none" stroke="#4a9eff" stroke-width="3"/>
  <line x1="3" y1="21" x2="61" y2="21" stroke="#4a9eff" stroke-width="2.5"/>
  <circle cx="10" cy="15.5" r="2.1" fill="#4a9eff"/>
  <circle cx="17" cy="15.5" r="2.1" fill="#4a9eff"/>
  <circle cx="24" cy="15.5" r="2.1" fill="#4a9eff"/>
  <path d="M18 30h28a5 5 0 0 1 5 5v9a5 5 0 0 1-5 5H31l-8 7v-7h-5a5 5 0 0 1-5-5v-9a5 5 0 0 1 5-5z"
        fill="none" stroke="#f2b544" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="26" cy="39.5" r="2.4" fill="#f2b544"/>
  <circle cx="34" cy="39.5" r="2.4" fill="#f2b544"/>
  <circle cx="42" cy="39.5" r="2.4" fill="#f2b544"/>
</svg>
