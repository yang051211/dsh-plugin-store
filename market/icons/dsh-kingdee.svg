<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="kd-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B365D" />
      <stop offset="50%" stop-color="#0A2240" />
      <stop offset="100%" stop-color="#051428" />
    </linearGradient>
    <linearGradient id="kd-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDF00" />
      <stop offset="50%" stop-color="#E5A823" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
    <linearGradient id="kd-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0077C2" />
    </linearGradient>
    <filter id="kd-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background badge -->
  <rect width="128" height="128" rx="28" fill="url(#kd-bg)" />
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="url(#kd-gold)" stroke-width="2" stroke-opacity="0.35" />

  <!-- Cloud Starry Sky silhouette -->
  <path d="M 44 76 L 84 76 A 16 16 0 0 0 92 46 A 22 22 0 0 0 52 38 A 18 18 0 0 0 36 60 A 16 16 0 0 0 44 76 Z" fill="none" stroke="url(#kd-cyan)" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" />

  <!-- Four-point Kingdee Star in the sky -->
  <path d="M 88 32 Q 88 40 96 40 Q 88 40 88 48 Q 88 40 80 40 Q 88 40 88 32 Z" fill="url(#kd-gold)" filter="url(#kd-glow)" />
  <path d="M 40 38 Q 40 43 45 43 Q 40 43 40 48 Q 40 43 35 43 Q 40 43 40 38 Z" fill="url(#kd-gold)" opacity="0.85" />

  <!-- Enterprise Database / Service Nodes -->
  <g fill="none" stroke="url(#kd-gold)" stroke-width="3" stroke-linecap="round">
    <ellipse cx="64" cy="88" rx="24" ry="7" />
    <path d="M 40 88 v 10 c 0 4 10.7 7 24 7 s 24 -3 24 -7 v -10" />
    <path d="M 40 98 v 10 c 0 4 10.7 7 24 7 s 24 -3 24 -7 v -10" />
  </g>

  <!-- Connective Data Sparks -->
  <circle cx="64" cy="58" r="3.5" fill="#FFFFFF" filter="url(#kd-glow)" />
  <line x1="64" y1="62" x2="64" y2="81" stroke="#FFFFFF" stroke-width="2.5" stroke-dasharray="3,3" />
</svg>
