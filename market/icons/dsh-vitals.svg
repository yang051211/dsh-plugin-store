<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2B4A"/>
      <stop offset="1" stop-color="#070B16"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".55" r=".55">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".28"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".15"/>
      <stop offset=".55" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A3E635"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2"/></filter>
    <clipPath id="c"><rect width="64" height="64" rx="15"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="64" height="64" fill="url(#bg)"/>
    <rect width="64" height="64" fill="url(#glow)"/>
    <!-- monitor grid -->
    <path d="M0 16h64M0 24h64M0 32h64M0 40h64M0 48h64M16 0v64M24 0v64M32 0v64M40 0v64M48 0v64" stroke="#7DD3FC" stroke-opacity=".07" stroke-width="1"/>
  </g>
  <!-- trace: fades in from the left like a live scope, glows at the tip -->
  <path d="M7 35h12l4-9 6 18 6-28 5 19h7" fill="none" stroke="url(#trace)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#blur)" opacity=".7"/>
  <path d="M7 35h12l4-9 6 18 6-28 5 19h7" fill="none" stroke="url(#trace)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="49" cy="35" r="5.5" fill="#A3E635" opacity=".35" filter="url(#blur)"/>
  <circle cx="49" cy="35" r="3" fill="#ECFCCB"/>
  <rect x=".5" y=".5" width="63" height="63" rx="14.5" fill="none" stroke="#fff" stroke-opacity=".1"/>
</svg>
