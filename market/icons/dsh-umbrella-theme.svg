  <!--
    Umbrella theme icon.

    The canopy is the eight-segment red-and-white Umbrella Corporation mark:
    eight equal panels converging on one apex, odd/even panels alternating, each
    outer edge a quadratic that sags inward between its corners (the canopy
    ripple). Geometry was re-derived from the published corporate mark, then
    redrawn and re-framed for this theme.

    The Umbrella Corporation mark is a Capcom / Resident Evil trademark. This is
    a fan re-creation for a locally installed personal theme, not licensed
    artwork: do not redistribute it commercially.
  -->
