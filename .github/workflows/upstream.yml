# Daily upstream check: refresh the catalog's upstream facts and weekly numbers, compare every listed plugin's newer
# npm version with the reviewed one, and keep one tracking issue up to date. It never approves a version: listing a new
# version still means editing catalog/catalog.yaml by hand after reading the report.
name: upstream

on:
  schedule:
    - cron: '17 1 * * *' # 09:17 Beijing time
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: upstream
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # One unreachable plugin must not stop the rest; its previous facts stay in place.
      - name: Refresh upstream facts
        run: npm run catalog:fetch
        continue-on-error: true

      - name: Rebuild the published index
        run: |
          npm run catalog:build
          npm run catalog:check

      - name: Compare newer upstream versions
        run: node tools/catalog/cli.mjs updates > "$RUNNER_TEMP/report.md"

      - name: Commit refreshed facts
        run: |
          git add catalog/upstream catalog/scan market
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "catalog: daily upstream check"
          git push

      - name: Update the tracking issue
        run: |
          gh label create upstream-updates --color 6e7781 --description "新版本待审（每天自动更新）" --force
          issue=$(gh issue list --label upstream-updates --state open --json number --jq '.[0].number')
          if grep -q '没有待审的新版本' "$RUNNER_TEMP/report.md"; then
            if [ -n "$issue" ]; then gh issue close "$issue" --comment "上游没有待审的新版本了。"; fi
            exit 0
          fi
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --body-file "$RUNNER_TEMP/report.md"
          else
            gh issue create --title "上游新版本待审" --label upstream-updates --body-file "$RUNNER_TEMP/report.md"
          fi
