    review:
      status: approved
      version: 2.0.10
      reviewer: yang051211
      notes:
        zh: "⚠ 装完还不能用：需要手动运行一次安装脚本，在 PowerShell 里执行 powershell -ExecutionPolicy Bypass -File \"$env:USERPROFILE/.dsh/profiles/<你的配置名>/node_modules/dsh-plugin-rea/scripts/rea-bundle-bootstrap.ps1\" -Reuse（-Reuse 表示复用本机已有的 Ghidra/JDK），然后重启 DSH。在此之前插件页会显示「运行中」，但对话里没有 REA 工具。脚本会从官方发布地址下载约 800MB 的工具链（Node、JDK 21、Ghidra 12、Apktool、jadx、Android 平台工具、rea-agents），版本锁定并校验 sha256，装到 ~/.dsh/plugins/rea-bundle/，装好后占用约 1.6GB，另有约 800MB 下载缓存（cache 目录，可删除，重装时会重新下载）；下载中断时重跑同一条命令即可续装；装过一次之后，缺失的组件会在后台自动补装，设置环境变量 REA_BUNDLE_AUTO_PROVISION=0 可关闭。⚠ 卸载插件后需手动删除 ~/.dsh/plugins/rea-bundle/。⚠ 与 dsh-rea 注册同名的 rea 服务，两者只能装一个。分析能力来自上游 REA（rea-agents 6.7.0，MIT，已审：无遥测，更新需手动执行 rea update）；启动子进程、调试与抓包是逆向工具的本职。插件本身没有自我更新，check-updates.ps1 只检查不安装。没有依赖。已在隔离的 DSH 0.2.1-rc.2 与桌面端实测可安装，安装脚本已在桌面端试运行核对计划。"
      permissions: { network: true, fileSystem: true, agentTools: true, childProcess: true, installScripts: false }
      date: 2026-10-20
