        - 会话日志只追加回退标记，不删改原记录
    usage:
      where:
        zh: 每条用户消息操作行上的「↶ 回退」按钮，或在输入框输入 /rewind
      try:
        zh: 让 Agent 改一个文件，然后回退那一轮并选「回退对话和代码」
    screenshots: []
    review:
      status: approved
      version: 0.17.1
      reviewer: yang051211
      notes:
        zh: 读写文件：备份并还原 Agent 改过的工作区文件。回退本身不能撤销，但被撤回的内容仍保留在会话日志里。不联网、无子进程、没有依赖。扫描命中的「Agent 工具」：它依赖 tools 服务，用来监听 Agent 每次调用工具的前后事件，在写文件前做备份，不给模型新增工具。prepare 脚本只在从 Git 源码安装时运行。
      permissions: { network: false, fileSystem: true, agentTools: false, childProcess: false, installScripts: false }
      date: 2026-10-21
  - name: dsh-ops
    source: npm
    category: dev
    title: { zh: 命令行增强, en: DSH Ops }
    tagline:
      zh: 给 Agent 一个真正的 bash 和一组 Rust 高速文件工具，Windows、macOS、Linux 都能用
      en: A real bash and fast Rust file tools for agents on Windows, macOS and Linux
    features:
      zh:
        - 独立的 bash，Windows 上 Agent 不再和 PowerShell 打架
        - Rust 编写的快速批量读文件、查找工具
        - 按需读取 CSV、DOCX 正文和 PDF 文本
        - 七个组件可以单独开关，文件操作遵循 DSH 权限
    usage:
      where:
        zh: 没有单独界面，Agent 多了 ops_bash 等工具
      try:
        zh: 让 Agent 用 ops_bash 列出当前目录并统计文件数
    screenshots: []
    review:
      status: approved
      version: 0.4.1
      reviewer: yang051211
      notes:
        zh: 支持 Windows x64、macOS（Apple 芯片）和 Linux x64。⚠ 带预编译程序（Windows 上是 dsh-ops-worker.exe、opsipc.dll、opsnt.dll，另两个平台各有对应的 worker），附 Rust 源码和溯源记录，但无法逐字节核对程序和源码一致；Windows 的 bash 来自可选依赖 @dsh-ops/bash-win32-x64（打包自 Git for Windows）。命令行另带三个需要你手动运行的命令：profile-install（调用官方 dsh plugin add 安装）、panel（只监听本机 127.0.0.1）、provision-shells（从官方 GitHub Release 下载锁定版本并校验 sha256，要用本机 curl）。插件运行时不联网。0.4.1 相对 0.3.0 几乎重写，已按 0.4.1 重新审核。
      permissions: { network: false, fileSystem: true, agentTools: true, childProcess: true, installScripts: false }
      date: 2026-10-21
  - name: "@tencent-connect/dsh-qqbot"
    source: npm
    category: tools
    title: { zh: QQ 机器人, en: QQ Bot }
    tagline:
      zh: 把 DSH 接进 QQ 官方机器人：私聊直接聊，群里 @ 它就回答，扫码即绑定
      en: Bring DSH to an official QQ Bot — chat in DMs or @-mention it in groups, bound with one QR scan
    features:
      zh:
        - 扫码绑定，AppID 和密钥自动保存，不用手填
        - 私聊直接聊，群里 @ 机器人触发，每个人、每个群各一条独立会话
        - 流式回复、Markdown 分段，图片和文件双向收发
        - /new、/model、/preset、/stop 等指令，单选题变成内联按钮
        - 私聊和群聊白名单，关键操作在 QQ 里点「允许 / 拒绝」确认
    usage:
      where:
        zh: 右侧栏的「QQ Bot 绑定」页（装好后首次启动会自动打开）；绑定后在 QQ 私聊里直接发消息，或在群里 @ 机器人
      try:
        zh: 扫码绑定后，在 QQ 私聊里发一句「你好」，再发一张图片让它描述
      setup:
        zh: 需要一个 QQ 开放平台（q.qq.com）的机器人，扫码流程会引导你创建或选择；绑定后把配置里的 access.c2cMode 和 access.groupMode 改成 allowlist 并填入白名单，否则任何加了机器人的人都能驱动你本机的 Agent
    screenshots: []
    review:
      status: approved
      version: 0.5.2
      reviewer: yang051211
      notes:
        zh: >-
          腾讯 QQ 开放平台官方出品。联网：经腾讯官方 SDK 只连 QQ 开放平台接口（api.bot.qq.com），另外下载 QQ 用户发来的图片和文件，视觉工具会按模型给出的地址取图。写文件：⚠ 扫码绑定后把 AppID 和 AppSecret 明文写进本 profile 的 cordis.patch.yml（不走 DSH 凭据服务）；⚠ 打开视觉理解时会改 ~/.dsh/settings.yaml，给所选模型补上 input: [text, image]；收到的媒体和模型偏好放在 ~/.dsh-qqbot，到期清理只删自己目录里的文件。子进程：没有端内页时用系统命令打开浏览器显示二维码。Agent 工具：注册「发文件」和「看图」两个工具，发文件默认只限媒体目录和工作目录。⚠ QQ 里的人能驱动你本机的 Agent（读写文件、跑命令），默认私聊和群聊都是开放模式，上线前务必改白名单。有 1 个压缩过的前端文件。依赖 4 个（腾讯官方 qqbot-nodejs 与 qqbot-connector、qrcode、js-yaml）。
      permissions: { network: true, fileSystem: true, agentTools: true, childProcess: true, installScripts: false }
      date: 2026-10-23
