      setup:
        zh: 先在 PowerShell 里运行一次安装脚本：powershell -ExecutionPolicy Bypass -File "$env:USERPROFILE/.dsh/profiles/<你的配置名>/node_modules/dsh-plugin-rea/scripts/rea-bundle-bootstrap.ps1" -Reuse，然后完全退出并重新打开 DSH
