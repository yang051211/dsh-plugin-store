# 人工收录清单：所有人写的内容都只在这里。工具只读不写。
# 字段说明见 docs/superpowers/plans/2026-10-19-plan-2-catalog-tooling.md Task 1。

market:
  title: { zh: 精选插件商城, en: Curated Plugin Store }
  description: { zh: 人工逐个审核过的 DeepSeek Harness 插件, en: Hand-reviewed plugins for DeepSeek Harness }

categories:
  - { id: ui, title: { zh: 界面与体验, en: UI & Experience } }
  - { id: tools, title: { zh: 工具与能力, en: Tools & Capabilities } }
  - { id: memory, title: { zh: 记忆与上下文, en: Memory & Context } }
  - { id: dev, title: { zh: 开发者工具, en: Developer Tools } }
  - { id: cost, title: { zh: 费用与用量, en: Cost & Usage } }
  - { id: fun, title: { zh: 娱乐与个性化, en: Fun & Personalization } }

featured:
  plugin: dsh-chat-toc
  title: { zh: 长对话一键导航 }
  subtitle: { zh: 为每轮对话生成目录，长会话不再翻滚轮 }
  gradient: [ '#4338ca', '#db2777' ]

sections:
  - { id: ui-better, title: { zh: 让界面更顺手 }, plugins: [ dsh-chat-toc, dsh-better-sidebar, dsh-prompt-history, dsh-session-manager, "@yfwu2020/dsh-selection-explain" ] }
  - { id: insight, title: { zh: 看清 Agent 在做什么 }, plugins: [ dsh-context, dsh-image-gen, dsh-vision-router, dsh-mcp-connector ] }
  - { id: memory, title: { zh: 让 Agent 记住你的项目 }, plugins: [ dsh-mnemon, dsh-prime-memory, sage-mem ] }
  - { id: dev, title: { zh: 开发者必备 }, plugins: [ dsh-ui-ux-pro-max, dsh-genui, dsh-code-security, dsh-file-review, dsh-ghidra, dsh-sql-workbench, dsh-api-client, dsh-lsp-actions, dsh-doublecheck, dsh-remote ] }
  - { id: cost, title: { zh: 花钱心里有数 }, plugins: [ dsh-cost-meter, dsh-whale-widget ] }
  - { id: fun, title: { zh: 让 DSH 更有趣 }, plugins: [ dsh-pet, dsh-dream-skin ] }

plugins:
  - name: dsh-chat-toc
    source: npm
    category: ui
    title: { zh: 对话目录, en: Chat TOC }
    tagline:
      zh: 把对话右侧的消息刻度变成能预览、搜索和收藏的目录
      en: Turns the chat's turn rail into an outline you can preview, search and bookmark
    features:
      zh:
        - 鼠标悬停刻度就能预览这一轮的提问和回答，并一键收藏或复制
        - 关键词搜索，长对话会自动往前翻页，直到定位到历史消息
        - 一键只看含代码或含工具调用的轮次，或只看收藏
        - 收藏在刷新、重启后都保留，会话删除时才清除
        - 一键把整场对话导出成 Markdown 大纲
    screenshots:
      - url: https://cdn.jsdelivr.net/gh/a792883583/dsh-chat-toc@f6d43a9b381b/docs/toc-pop.png
        caption: { zh: 悬停卡片：提问和回答预览，可收藏和复制 }
      - url: https://cdn.jsdelivr.net/gh/a792883583/dsh-chat-toc@f6d43a9b381b/docs/toc-bar.png
        caption: { zh: 收藏过滤：已收藏的轮次高亮显示 }
    review:
      status: approved
      version: 0.5.1
      date: 2026-10-19
      reviewer: yang051211
      notes:
        zh: 纯前端增强。扫描未发现联网、文件读写、Agent 工具、子进程或安装脚本，没有依赖。它靠 DSH 官方界面上的数据属性定位消息，DSH 界面大改版时可能暂时失效。
      permissions: { network: false, fileSystem: false, agentTools: false, childProcess: false, installScripts: false }

  - name: dsh-context
    source: npm
    category: tools
    title: { zh: 上下文洞察, en: Context Insights }
    tagline:
      zh: 看清 Agent 的上下文窗口里装了什么、怎么增长、花了多少钱
      en: See what fills the agent's context window, how it grows, and what it costs
    features:
      zh:
        - 侧边栏「上下文洞察」总览页：用量、费用、缓存命中率、每日活跃热力图和各会话画像
        - 会话内「上下文」标签：当前上下文构成、每次请求的增长趋势、压缩事件和文件操作
        - 「Fleet」标签：当前 Agent、它的上级和所有子 Agent 的实时卡片
        - /context 命令：在对话里直接弹出上下文构成和浏览器
        - 按官方价格估算费用，支持 DeepSeek 峰谷计价
    screenshots:
      - url: https://cdn.jsdelivr.net/gh/bowenliang123/dsh-context@c22ccb203915/docs/context-dashboard.png
        caption: { zh: 侧边栏的上下文洞察总览页 }
      - url: https://cdn.jsdelivr.net/gh/bowenliang123/dsh-context@c22ccb203915/docs/context-overview.png
        caption: { zh: 会话内的上下文标签 }
      - url: https://cdn.jsdelivr.net/gh/bowenliang123/dsh-context@c22ccb203915/docs/context-trend.png
        caption: { zh: 上下文随请求增长的趋势 }
    review:
      status: approved
      version: 0.73.3
      date: 2026-10-19
      reviewer: yang051211
      notes:
        zh: >-
          联网三处：调用自己的 /api/dsh-context 接口；每小时向 npm 官方源或 npmmirror 查询自身最新版本； 用 DSH 里配置的 DeepSeek 接口地址和 API Key 请求 /user/balance 查询账户余额（从代码看，密钥只发往你配置的接口地址）。 读写文件：为上下文浏览器把会话附件用硬链接或复制的方式存到自己的目录。 package.json 里的 prepare 脚本（husky && tsdown）只在从 Git 源码安装时运行，从 npm 安装不会运行。 发布的代码是压缩过的，以上结论来自对压缩代码的抽查。依赖 1 个（zod）。
      permissions: { network: true, fileSystem: true, agentTools: false, childProcess: false, installScripts: false }
  - name: dsh-better-sidebar
    source: npm
    category: ui
    title: { zh: 增强侧栏, en: Better Sidebar }
    tagline:
      zh: 文件树、编辑器、Git、任务和侧边对话合进一栏，像 IDE 一样用 DSH
      en: File tree, editor, Git, tasks and side chat in one column — an IDE-like DSH
    features:
      zh:
        - 带 Git 状态颜色的文件树，支持全局搜索、拖拽上传和批量操作
        - 可编辑的代码编辑器，Markdown、Mermaid、HTML 预览
        - Git 面板：暂存、提交、分支同步，加上只读的提交图
        - 实时查看子 Agent 拓扑和后台任务
        - 可选的「服务器」页：导入 ~/.ssh/config，打开 SSH 终端
    screenshots: []
    review:
      status: approved
      version: 0.28.0
      reviewer: yang051211
      notes:
        zh: 联网：只在你使用相关功能时访问对应地址（例如服务器页的 SSH 连接）。读写文件：工作区文件的浏览、编辑、上传。子进程：调用本机 git 读取和提交改动、探测工具版本、在 WSL 下做路径转换；扫描中大量的 fork() 命中来自编辑器库代码，是误报。服务器页导入 ~/.ssh/config 需要你主动点击。依赖 33 个，主要是 CodeMirror、xterm.js、Mermaid 等界面库。
      permissions: { network: true, fileSystem: true, agentTools: true, childProcess: true, installScripts: false }
      date: 2026-10-19
  - name: dsh-prompt-history
    source: npm
    category: ui
    title: { zh: 输入历史, en: Prompt History }
    tagline:
      zh: 像终端一样按 ↑ 翻出以前发过的话，输入前缀还能精确匹配
      en: "Shell-style prompt history in the composer: press ↑, with prefix search"
    features:
      zh:
        - 空输入时按 ↑ 召回上一条发送过的消息，↓ 往回翻
        - 输入前缀后按 ↑，只翻以这个前缀开头的历史
        - 翻到底自动恢复你原本正在输入的内容
        - 终端式的复制粘贴和引用
    screenshots: []
    review:
      status: approved
      version: 1.4.2
      reviewer: yang051211
      notes:
        zh: 纯浏览器端插件，历史保存在浏览器本地。只有可关闭的「上下文预测建议」会调用当前会话的模型，不访问其他网络地址。扫描命中的「执行命令」是会话 fork 接口的同名调用，属于误报。package.json 的 prepare 脚本（pnpm build）只在从 Git 源码安装时运行，从 npm 安装不会运行。没有依赖。
      permissions: { network: false, fileSystem: false, agentTools: false, childProcess: false, installScripts: false }
      date: 2026-10-19
  - name: dsh-session-manager
    source: npm
    category: ui
    title: { zh: 会话管理, en: Session Manager }
    tagline:
      zh: 批量整理会话和工作区：归档、移动、收藏、打标签、稍后再看
      en: "Batch-manage sessions and workspaces: archive, move, favorite, tag, review later"
    features:
      zh:
        - 删除、归档、恢复会话，删除前一定会确认
        - 把会话移到别的工作区，历史和标题都保留
        - 收藏、稍后再看、优先级、标签和备注
        - 工作区归档和显隐，支持批量操作
    screenshots: []
    review:
      status: approved
      version: 0.7.3
      reviewer: yang051211
      notes:
        zh: 联网：只向 npm 官方源或 npmmirror 查询新版本。读写文件：修改 DSH 会话数据（移动、归档、删除），删除不可恢复但每次都会确认。无子进程，没有依赖。
      permissions: { network: true, fileSystem: true, agentTools: false, childProcess: false, installScripts: false }
      date: 2026-10-19
  - name: "@yfwu2020/dsh-selection-explain"
    source: npm
    category: ui
    title: { zh: 划词解读, en: Selection Explain }
    tagline:
      zh: 选中一段文字，就地看翻译和它在上下文里的意思，还能直接语音追问
      en: Select text to see a translation and what it means in context, then ask by voice
    features:
      zh:
        - 选中文字后弹出按钮，流式显示专业的中英翻译
        - 解释这段文字在当前上下文里的含义
        - 在解读小窗里继续追问，支持语音输入
        - 解读历史和小窗位置会记住
    screenshots: []
    review:
      status: approved
      version: 0.11.0
      reviewer: yang051211
      notes:
        zh: 调用你在 DSH 里配置的模型，不访问其他网络地址。读写文件：只在 ~/.dsh/selection-explain 下保存解读历史和窗口位置。子进程：仅 macOS 上用于「麦克风占用检测」——首次使用时用本机 clang 编译一个随包附带的小程序再运行，这个做法不常见，但只在本机、只读麦克风状态；Windows 上直接跳过。没有依赖。
      permissions: { network: false, fileSystem: true, agentTools: false, childProcess: true, installScripts: false }
      date: 2026-10-19
  - name: dsh-image-gen
    source: npm
    category: tools
    title: { zh: AI 图像创作, en: Image Gen }
    tagline:
      zh: 对话生图、画布创作、批量工作台和多模型对比，一个插件补齐图像创作
      en: Chat image generation, a canvas, a batch studio and model comparison in one plugin
    features:
      zh:
        - 对话里文生图、图生图，连续修改和版本迭代
        - AI 创作画布：草稿、参考图组合、空间创作
        - 工作台批量生成，多图参考和高级参数
        - 支持 Gemini、OpenAI、Seedream、通义、Grok、GLM 和本地 ComfyUI
        - 灵感库和图库：搜索、收藏、下载、复用
    screenshots: []
    review:
      status: approved
      version: 0.9.1
      reviewer: yang051211
      notes:
        zh: 联网：调用你选择的图像模型服务（自带 Key，或在插件里登录 ChatGPT、Grok、Google 订阅账号；后者是插件内自行登录，不读取其他软件的登录文件，但用订阅账号走第三方插件生图是否符合服务商条款需自行判断）。读写文件：生成结果按工作区存在 ~/.dsh 下。扫描到的 TLDRAW_LICENSE_KEY 等环境变量名来自它打包的白板库 tldraw，属于误报。prepare 脚本只在从 Git 源码安装时运行。无子进程。
      permissions: { network: true, fileSystem: true, agentTools: true, childProcess: false, installScripts: false }
      date: 2026-10-19
  - name: dsh-vision-router
    source: npm
    category: tools
    title: { zh: 视觉路由, en: Vision Router }
    tagline:
      zh: 给只能读文字的模型装上眼睛：内置免费识图链，加像素级的图片工具
      en: "Eyes for text-only models: a built-in free vision chain plus pixel-level image tools"
    features:
      zh:
        - 自动把图片交给视觉模型识别，再把结果交给当前模型
        - 内置免费识图通道，也可以接你自己的视觉模型
        - 像素级工具：裁剪、标注、OCR、矢量化
        - 可切换为严格本地模式，图片不出本机
    screenshots: []
    review:
      status: approved
      version: 3.0.4
      reviewer: yang051211
      notes:
        zh: ⚠ 默认会把图片发到云端：新装时启用了匿名的 OVHcloud 免费识图通道，图片、识图提示词和请求元数据会发给该服务，机密或受监管的材料请切换到严格本地模式（作者在 README 开头明确提示）。子进程：调用本机已安装的 tesseract 做 OCR、用本机 Chrome/Edge 截图、打开日志目录；自我更新时调用 DSH 官方命令 dsh plugin add，走 DSH 自己的安装流程。依赖 5 个（puppeteer-core、potrace、undici、zod、schemastery）。prepare 脚本只在从 Git 源码安装时运行。
      permissions: { network: true, fileSystem: true, agentTools: true, childProcess: true, installScripts: false }
      date: 2026-10-19
  - name: dsh-mcp-connector
    source: npm
    category: tools
    title: { zh: MCP 连接器, en: MCP Connector }
    tagline:
      zh: 上百个 MCP 连接器一站接入，跨连接搜索工具，出了问题能自己排查
      en: Connect 100+ MCP servers, search tools across connections, and troubleshoot them
    features:
      zh:
        - 从连接器目录一键接入 MCP Server，支持 OAuth、API Key、HTTP 和 stdio
        - 跨所有已启用连接搜索工具，查看参数、来源和缓存时间
        - 连接检查、重新发现工具，鉴权失败自动暂停重试
        - 可直接导入现有的 mcpServers JSON
    screenshots: []
    review:
      status: approved
      version: 0.2.75
      reviewer: yang051211
      notes:
        zh: 联网：连接你配置的 MCP 服务，从 GitHub、jsDelivr 获取连接器目录，向 npm 查新版本。子进程：启动 stdio 类型的 MCP Server（这是 MCP 的标准做法），以及 OAuth 授权时打开浏览器。读写文件：在 DSH 数据目录保存授权记录。工具调用仍经过 DSH 的审批链。依赖 2 个（cross-spawn、undici）。
      permissions: { network: true, fileSystem: true, agentTools: true, childProcess: true, installScripts: false }
      date: 2026-10-19
  - name: dsh-mnemon
    source: npm
    category: memory
    title: { zh: 分层记忆, en: Mnemon Memory }
    tagline:
      zh: 可组合、看得见的分层记忆：常用的常驻上下文，长期资料需要时再检索
      en: "Composable, visible layered memory: the essentials stay in context, long-term material is searched on demand"
    features:
      zh:
        - 偏好和工作事实常驻上下文，项目文档和长期资料只在需要时检索
        - 每条回复下方列出这一轮读写了哪些记忆，一键打开查看和编辑
        - 一键把对话里值得保留的事实存进记忆，自动去重提炼
        - 在插件页自由组合记忆来源和策略，可选接入 mem0、supermemory 等外部记忆服务
        - 记忆可以通过 Git 仓库同步到多台机器
    screenshots: []
    review:
      status: approved
      version: 0.5.32
      reviewer: yang051211
      notes:
        zh: 联网：向 npm 和 GitHub 查询新版本；只有在你选择外部记忆服务（mem0、supermemory 等 9 家适配）后，记忆才会发往对应服务；开启 Git 同步后推送到你配置的仓库（可用环境变量 MNEMON_SYNC_GIT_TOKEN 提供令牌）。读写文件：记忆保存在本地 DSH 数据目录。子进程：调用本机已安装的 mnemon 命令行；在 Windows 上只读查询一次注册表（reg.exe）。依赖 22 个，大多是它自家的来源、策略和服务适配包。
      permissions: { network: true, fileSystem: true, agentTools: true, childProcess: true, installScripts: false }
      date: 2026-10-19
  - name: dsh-prime-memory
    source: npm
    category: memory
    title: { zh: 分层蒸馏记忆, en: Prime Memory }
    tagline:
      zh: 对话在后台自动沉淀成四层记忆，模型每一步前自动召回相关内容
      en: Distills conversations into four memory layers and recalls what is relevant before every model step
    features:
      zh:
        - 自动捕获对话，逐层提炼成原子记忆、场景块和核心画像
        - 模型每一步前自动把相关记忆注入上下文
        - 关键词和向量混合检索，带中文分词
        - 可选本地嵌入模型，不必调用在线嵌入接口
    screenshots: []
    review:
      status: approved
      version: 0.26.4
      reviewer: yang051211
      notes:
        zh: 联网：调用你在 DSH 里配置的模型做记忆提炼，调用嵌入接口；开启本地嵌入时从 hf-mirror.com 下载模型并校验 sha256。子进程：只在你主动开启本地嵌入时，在它自己的数据目录执行一次 npm ci --ignore-scripts，安装钉死版本的 @huggingface/transformers 4.2.0（带锁文件、禁止安装脚本）。依赖 4 个（undici、sqlite-vec、jieba、schemastery）。
      permissions: { network: true, fileSystem: true, agentTools: true, childProcess: true, installScripts: false }
      date: 2026-10-19
  - name: sage-mem
    source: npm
    category: memory
    title: { zh: 文件记忆, en: Sage Memory }
    tagline:
      zh: 跨会话记忆就是几份 Markdown 文件，不要数据库，也不要后台进程
      en: Cross-session memory as plain Markdown files — no database, no worker
    features:
      zh:
        - 记忆以 Markdown 文件保存，随时可以直接打开修改
        - 按需检索记忆注入对话，并提供检索、读取记忆的工具
        - 写入前有安全检查，防止误覆盖
        - 可以把 Claude Code 的记忆迁移过来
        - 「Autodream」定期自动整理记忆
    screenshots: []
    review:
      status: approved
      version: 1.0.2
      reviewer: yang051211
      notes:
        zh: 联网：只向 GitHub 查询新版本（可用 GITHUB_TOKEN 或 GH_TOKEN 提高查询额度）。读写文件：记忆存放在 ~/.sage-mem/memory，并读取 DSH 会话记录判断是否需要整理。无子进程、无安装脚本，依赖 1 个（zod）。扫描未命中联网是因为它的请求写法不在扫描规则里，审核时看代码确认有联网。
      permissions: { network: true, fileSystem: true, agentTools: true, childProcess: false, installScripts: false }
      date: 2026-10-19
  - name: dsh-cost-meter
    source: npm
    category: cost
    title: { zh: 费用统计, en: Cost Meter }
    tagline:
      zh: 本会话和当天花了多少钱一目了然，带预算提醒和官方价格同步
      en: See what this session and today cost, with budgets and official price sync
    features:
      zh:
        - 实时显示本会话成本和当日费用，带历史看板
        - 内置 170 多个模型的价格，一键同步官方价格，支持峰谷计价
        - 设置预算，接近或超出时提醒
        - 查询 DeepSeek 等官方账户余额和 coding plan 额度
