    title: { zh: REA 万物逆向, en: REA — Reverse Engineer Anything }
    tagline:
      zh: 一个插件逆向一切：原生程序、安卓 APK、Electron 应用都能让 Agent 来拆，跑一次安装脚本就备齐运行环境
